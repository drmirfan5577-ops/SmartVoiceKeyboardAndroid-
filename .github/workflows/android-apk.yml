name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /home/runner/app
    steps:
      - name: Clone to short path
        working-directory: /home/runner
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" app
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: pnpm install --no-frozen-lockfile --prod=false
      - name: Prebuild android project
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install
      - name: Gradle assembleRelease
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/smart-voice-keyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smart-voice-keyboard-apk
          path: /home/runner/app/out/smart-voice-keyboard.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SMART Voice Keyboard — APK (${{ github.run_number }})
          body: خودکار بلڈ شدہ اینڈرائیڈ APK
          files: /home/runner/app/out/smart-voice-keyboard.apk
          make_latest: true
